<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocaTrack — Photocard Collection & Wishlist Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Firebase Compat SDKs (App, Auth, Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fdf2f8',
              100: '#fce7f3',
              400: '#f472b6',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
            }
          }
        }
      }
    }
  </script>
  <style>
    .aspect-photocard {
      aspect-ratio: 55 / 85;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 9999px;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200">

  <!-- Header & Navigation -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <button id="logoHomeBtn" type="button" class="flex items-center gap-3 text-left focus:outline-none group" title="Go to Default Home Page">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
          <i class="ph-bold ph-cards text-xl"></i>
        </div>
        <div>
          <span class="font-extrabold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-brand-600 to-indigo-600 dark:from-brand-400 dark:to-indigo-400 bg-clip-text text-transparent">PocaTrack</span>
          <span class="hidden sm:inline-block text-xs uppercase font-bold tracking-widest text-slate-600 dark:text-slate-300 ml-2 px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">Collector</span>
        </div>
      </button>

      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Cloud Sync & Auth Status Controls -->
        <div id="authSection" class="flex items-center gap-2">
          <button id="openFirebaseSetupBtn" type="button" class="hidden flex items-center gap-1.5 px-3 py-2 rounded-xl border border-indigo-200 dark:border-indigo-800/70 bg-indigo-50/70 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 font-semibold text-xs sm:text-sm transition">
            <i class="ph-bold ph-cloud-arrow-up text-base"></i>
            <span class="hidden md:inline">Connect Cloud</span>
          </button>

          <button id="googleSignInBtn" type="button" class="flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs sm:text-sm shadow-sm transition active:scale-95">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
              <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
            </svg>
            <span>Sign in</span>
          </button>

          <div id="userProfilePill" class="hidden flex items-center gap-2 pl-2 pr-1.5 py-1 rounded-xl bg-emerald-50/80 dark:bg-emerald-950/40 border border-emerald-200/80 dark:border-emerald-800/60">
            <img id="userAvatar" src="" alt="User" class="w-6 h-6 rounded-full object-cover border border-emerald-300 dark:border-emerald-700">
            <div class="hidden md:flex flex-col text-left leading-none">
              <span id="userNameDisplay" class="text-xs font-bold text-slate-800 dark:text-slate-100 max-w-[90px] truncate">User</span>
              <span class="text-[10px] font-semibold text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Live Sync
              </span>
            </div>
            <button id="signOutBtn" type="button" class="p-1.5 rounded-lg hover:bg-emerald-100 dark:hover:bg-emerald-900/60 text-slate-600 dark:text-slate-300 transition" title="Sign Out">
              <i class="ph-bold ph-sign-out text-sm"></i>
            </button>
          </div>
        </div>

        <!-- Add Card Button -->
        <button id="openAddModalBtn" type="button" class="flex items-center gap-1.5 px-3.5 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-medium text-sm shadow-sm transition active:scale-95">
          <i class="ph-bold ph-plus"></i>
          <span class="hidden sm:inline">Add Photocard</span>
        </button>

        <!-- Backup/Tools Dropdown Button -->
        <div class="relative">
          <button id="toolsMenuBtn" type="button" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition" title="Data & Cloud Options">
            <i class="ph-bold ph-dots-three-vertical text-lg"></i>
          </button>
          <div id="toolsMenu" class="hidden absolute right-0 mt-2 w-56 bg-white dark:bg-slate-900 rounded-xl shadow-xl border border-slate-200 dark:border-slate-800 py-1.5 z-50 text-sm">
            <button id="menuFirebaseConfigBtn" type="button" class="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2.5 text-slate-700 dark:text-slate-300">
              <i class="ph ph-cloud-check text-base text-indigo-500"></i> Firebase Cloud Setup
            </button>
            <button id="syncLocalToCloudBtn" type="button" class="hidden w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2.5 text-emerald-700 dark:text-emerald-400 font-medium">
              <i class="ph ph-arrows-clockwise text-base"></i> Sync Local Cards to Cloud
            </button>
            <div class="border-t border-slate-200 dark:border-slate-800 my-1"></div>
            <button id="exportBtn" type="button" class="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2.5 text-slate-700 dark:text-slate-300">
              <i class="ph ph-download-simple text-base text-brand-500"></i> Export Backup (.json)
            </button>
            <label class="w-full text-left px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-2.5 text-slate-700 dark:text-slate-300 cursor-pointer">
              <i class="ph ph-upload-simple text-base text-indigo-500"></i> Import Backup
              <input type="file" id="importInput" accept=".json" class="hidden">
            </label>
            <div class="border-t border-slate-200 dark:border-slate-800 my-1"></div>
            <button id="resetStarterBtn" type="button" class="w-full text-left px-4 py-2 hover:bg-red-50 dark:hover:bg-red-950/40 text-red-600 dark:text-red-400 flex items-center gap-2.5">
              <i class="ph ph-arrow-counter-clockwise text-base"></i> Reset to Demo Cards
            </button>
          </div>
        </div>

        <!-- Theme Toggle -->
        <button id="themeToggleBtn" type="button" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition" aria-label="Toggle Theme">
          <i id="themeIcon" class="ph-bold ph-moon text-lg"></i>
        </button>
      </div>
    </div>

    <!-- Group Navigation Tabs Bar (All Groups + Individual Group Tabs + Star Favorite) -->
    <div class="bg-slate-100/80 dark:bg-slate-950/70 border-t border-slate-200/80 dark:border-slate-800/80">
      <div id="groupTabsBar" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-1.5 overflow-x-auto py-2 custom-scrollbar text-xs sm:text-sm font-semibold">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Cloud Sync Status / Local Migration Banner -->
    <section id="cloudBanner" class="hidden bg-gradient-to-r from-indigo-50 via-brand-50/60 to-purple-50 dark:from-indigo-950/50 dark:via-slate-9
